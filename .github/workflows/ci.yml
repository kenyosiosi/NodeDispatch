name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El nombre del job es el que exige la proteccion de ramas:
  # si se renombra, hay que actualizar el check requerido en GitHub.
  #
  # `ubuntu-24.04` va fijado a proposito: con `ubuntu-latest` GitHub puede
  # cambiar de imagen (y de GCC y de CMake) sin que toquemos el repo. Esta imagen
  # trae GCC 12/13/14 y `g++` apunta a 13.3.0, que es el compilador que valida el
  # CI. Los revisores pueden usar uno mas nuevo; el codigo es C++17, asi que 13
  # es el piso. Si se necesita otro compilador, se cambia aqui y se documenta.
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # El job no hace push: no dejar credenciales en el checkout.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versiones del toolchain
        run: |
          cmake --version
          g++ --version | head -n 1

      # DeSiGNAR y doctest se bajan por FetchContent: la primera build tarda
      # mas porque clona ambos repositorios. No se cachea build/_deps a
      # proposito: un cache viejo de FetchContent falla de formas dificiles de
      # diagnosticar y, con 4 semanas de proyecto, no compensa.
      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compilar
        run: cmake --build build --parallel

      - name: Probar
        run: ctest --test-dir build --output-on-failure

  # Job opcional con SFML habilitado: compila el target nodedispatch_gui
  # para detectar roturas de la demo grafica (S3.10). Requiere dependencias
  # del sistema que ubuntu-24.04 trae en los paquetes listados abajo.
  build-gui:
    name: build-gui (SFML)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar deps SFML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libfreetype6-dev libudev-dev

      - name: Versiones del toolchain
        run: |
          cmake --version
          g++ --version | head -n 1

      - name: Configurar con SFML
        run: cmake -S . -B build-gui -DCMAKE_BUILD_TYPE=Debug -DBUILD_SFML=ON

      - name: Compilar GUI
        run: cmake --build build-gui --target nodedispatch_gui --parallel 4

  # Verificacion de portabilidad: el job de arriba se queda intacto porque su
  # nombre es el check requerido por la proteccion de ramas. Esta matriz anade
  # macOS y Windows (MSVC en los runners de GitHub) sin tocar ese check.
  # `shell: bash` funciona en los tres sistemas: Git Bash esta en los runners
  # de Windows, y `--config Debug` / `-C Debug` se ignoran en generadores
  # de una sola configuracion (Makefiles), asi que los comandos son identicos.
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versiones del toolchain
        shell: bash
        run: |
          cmake --version
          # En Windows `cl.exe` no esta en el PATH de Git Bash: CMake configura
          # el entorno de Visual Studio por dentro, asi que imprimimos lo que
          # exista y no fallamos si falta alguno de los dos compiladores.
          c++ --version 2>/dev/null | head -n 1 || true
          cl.exe 2>/dev/null | head -n 1 || true

      - name: Configurar
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compilar
        shell: bash
        run: cmake --build build --parallel 4 --config Debug

      - name: Probar
        shell: bash
        run: ctest --test-dir build -C Debug --output-on-failure
